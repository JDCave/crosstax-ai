# A generic, single database configuration.

[alembic]
# path to migration scripts.
# Use forward slashes (/); also works on Windows.
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be named in numerical order
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files directly
# without needing to specify the source .py file
# sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using a version
# directory, the path below is relative to the
# alembic/ directory.
# version_locations = %(here)s/bar/bat

# set to 'true' to enable the use of Python's
# logging configuration in the env.py script
# (as opposed to the basicConfig() default)
# log_config = true

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
